services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    # restart: unless-stopped
    env_file: ".env"
    depends_on:
      - redis
  redis:
    container_name: redis
    image: redis:alpine
    restart: always
    volumes:
      - redis:/data
    command: "redis-server --save 60 1 --loglevel warning"

volumes:
  redis:
