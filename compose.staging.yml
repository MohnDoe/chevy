services:
  bot:
    image: mohndoe/chevy-bot:next
    restart: always
    env_file: ".env"
    depends_on:
      - redis
  redis:
    container_name: redis-staging
    image: redis:alpine
    restart: always
    volumes:
      - redis-staging:/data
    command: "redis-server --save 60 1 --loglevel warning"

volumes:
  redis-staging:
